; ============================================================================
;  WeaponSoundEnhance.ini —— 武器音效拓展插件配置
;  (由 WeaponSoundEnhanceGUI 生成)
;  路径：本文件在 plugins\WeaponSoundEnhance\ 下（与 DLL 同目录的旧布局也兼容）；
;        音效 wav 放在本文件同级的 sounds\ 文件夹里（旧位置 plugins\sounds\ 仍自动兼容）。
;
;  武器类型表（与原版武器序号一致）：
;    0=大剑  1=片手  2=双刀  3=太刀  4=大锤  5=笛子
;    6=长枪  7=铳枪  8=斩斧  9=盾斧 10=虫棍 11=弓箭 12=轻弩 13=重弩
;  每条 [AttackN] 代表一种派生攻击：
;    WeaponType  ：武器类型（0..13）。-1 = 任意武器。
;    ActionLMT/LMT：动作 LMT。-1 = 不限；多值用逗号分隔（LMT=）。
;    FSMId       ：动作状态机 ID。-1 = 不限。
;    三者 AND 关系；命中后从匹配的音效里选音效。
;    Group=              动作组（可选）：同一招的多个触发条目填相同组名
;                        时整招只响一次，刃色以首个触发瞬间为准。
;    Sound=               默认音效；Sound:none/white/yellow/red= 太刀无刃时/白刃时/
;                        黄刃时/红刃时 的音效（未配的刃时回退默认音效）。
;    音效写法 path|延时ms|音量0..100|F ，末尾 F = 固定音效：命中时恒播，
;                        同池其余未固定音效仍随机抽一条同时播放。
;  游戏内聊天框指令：/wse reload | on | off | more | one | vol N | vol+ | vol- | help
; ============================================================================

