; ============================================================================
;  WeaponSoundEnhance.ini —— 武器音效拓展插件配置
;  请放在与 WeaponSoundEnhance.dll 相同的目录。
;  音效 wav 文件请放到 DLL 同目录的 sounds\ 文件夹里。
;
;  说明：
;    - 每个 [AttackN] 段代表一种“派生攻击”，可配置多条音效，触发时随机抽一条播放。
;    - 段内三个匹配条件为 AND 关系；值为 -1 表示不限制该条件。
;        WeaponType  ：武器类型（0..13）。-1 = 任意武器。
;        ActionLMT   ：动作 LMT（派生动作号）。-1 = 不限。
;        FSMId       ：动作状态机 ID。-1 = 不限。
;    - Sound       ：一个或多个 wav 相对路径，用分号(;)分隔；多个时随机抽一条。
;
;  武器类型表（与原版武器序号一致）：
;    0=大剑  1=片手  2=双刀  3=太刀  4=大锤  5=笛子
;    6=长枪  7=铳枪  8=斩斧  9=盾斧 10=虫棍 11=弓箭 12=轻弩 13=重弩
;  每条对应一个派生动作。你只需把对应 .wav 放进 sounds\ 即可。

;
;  游戏内聊天框指令（只需在游戏聊天框输入并发送即可，无需其它前置）：
;    /wse reload        重载 ini
;    /wse on | off      开关音效
;    /wse more | one    切换“额外音效”
;    /wse vol 50        设定音量(0..100)
;    /wse vol+ | vol-   音量±5
;    /wse help          显示命令
; ============================================================================

[WeaponSoundEnhance]
; 全局玩家指针基址（十六进制）。一般无需改动；若游戏小版本变动导致失效可调整。
PlayerRoot=0x1450139A0
; 轮询间隔(毫秒)，越小反应越快但耗 CPU。
PollMs=60
; 同名/同派生动作触发的最短间隔(毫秒)，防止连点刷屏。
DebounceMs=120
; 音量 0..100
Volume=50
; 总开关 1=开 0=关
Enabled=1
; 是否使用每条目里的“额外音效”（多条音效）。1=一条目里随机播放，0=只播第一条。
MoreSounds=1
; 播放方式：playsound(winmm,几乎必响,单路) 或 dsound(可并发+音量可调,插件会自动重采样到44.1k)
Playback=dsound
; 游戏内聊天栏回显(1=在聊天栏显示结果, 0=只写日志)。默认1。
ChatEcho=1
; 游戏聊天框 /wse 指令开关（1=开启,默认开）。0=关闭(不读游戏内存)。
ChatCommands=1

; ----------------------------------------------------------------------------
; 游戏内热键（Ctrl 组合；17=Ctrl, 0=不要求修饰键）。数字是 Windows 虚拟键码。
;   ReloadKey  : 重载本 ini（默认 116 = F5）
;   VolUpKey   : 音量 +5（默认 38 = ↑）
;   VolDownKey : 音量 -5（默认 40 = ↓）
;   SetVolKey  : 把音量设为 SetVolValue 的值（默认 119 = F8）
;   ToggleKey  : 开关音效（默认 120 = F9）
;   MoreKey    : 切换“额外音效”开关（默认 121 = F10）
; 常见键码：33=PageUp 34=PageDown 37=← 38=↑ 39=→ 40=↓ 112~123=F1..F12
; ----------------------------------------------------------------------------
[Hotkeys]
ModifierKey=17
ReloadKey=116
VolUpKey=38
VolDownKey=40
SetVolKey=119
SetVolValue=50
ToggleKey=120
MoreKey=121

