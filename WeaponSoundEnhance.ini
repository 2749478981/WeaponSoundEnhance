; ============================================================================
;  WeaponSoundEnhance.ini —— 武器音效拓展插件配置
;  请放在与 WeaponSoundEnhance.dll 相同的目录；音效 wav 放到本目录的 sounds\ 下。
;
;  武器类型（与原版序号一致）：0大剑 1片手 2双刀 3太刀 4大锤 5笛子
;                       6长枪 7铳枪 8斩斧 9盾斧 10虫棍 11弓箭 12轻弩 13重弩
;
;  每条 [AttackN] 代表一个"派生攻击"，命中时按 AND 匹配：
;    WeaponType   : 武器(0..13)，-1=任意
;    ActionLMT/LMT: 动作 LMT，-1=不限；多值用逗号(LMT=49265,49256)
;    FSMId        : 动作状态机 ID，-1=不限
;  音效写法 path|延时ms|音量0..100|F ：分号分隔多条；末尾 F=固定音效(命中恒播，
;    同组其余未固定音效仍随机抽一条，同时叠播)。同文件 400ms 内不重复。
;  刃时音效(仅太刀) Sound:none/white/yellow/red=...（无刃时/白刃时/黄刃时/红刃时）；
;    未配置的刃时回退默认 Sound=。
;  动作组 Group=名 ：同一招的多个触发条目填相同组名 → 整招只响一次。
;  每武器配置组合：[WeaponW:组合名] 段包含该武器的一组 [AttackN]；
;    [Active] 段 W<type>=组合名 决定每武器当前用哪个组合（切换只改该武器）。
;
;  游戏内热键：Ctrl+F5 重载 / Ctrl+F9 开关 / Ctrl+F10 更多音效(旧条目) /
;             Ctrl+↑↓ 音量 / Ctrl+F8 设定音量 / Ctrl+F11 切换当前武器组合
;  游戏聊天框：/wse help | reload | on | off | more | one | vol N | vol+ | vol-
; ============================================================================

[WeaponSoundEnhance]
; 全局玩家指针基址（十六进制）。游戏小版本变动导致失效时才需调整。
PlayerRoot=0x1450139A0
PollMs=60
DebounceMs=120
Volume=50
Enabled=1
; 旧全局"更多音效"：仅对无固定音效的旧条目生效
MoreSounds=1
ChatEcho=1
ChatCommands=1
; 启用热键 1=开 0=关（关闭后游戏内 Ctrl 组合热键全部失效；/wse 聊天指令不受影响）
Hotkeys=1
; 调试日志 0=关 1=开（把每次播放/心跳写入 DLL 同目录 WeaponSoundEnhance.log）
Debug=0
; 太刀气刃等级读取偏移（链为 *(*(玩家+0x76B0)+0x2370)，写 3=红刃）
GaugePtrOff=0x76B0
GaugeValOff=0x2370

[Hotkeys]
ModifierKey=17
ReloadKey=116
VolUpKey=38
VolDownKey=40
SetVolKey=119
SetVolValue=50
ToggleKey=120
MoreKey=121
ComboKey=122

; ----------------------------------------------------------------------------
;  以下没有预置条目，请按上面的说明自行添加 [AttackN]。
;  示例（去掉行首 ; 即可启用）：
;
; ; [Attack1]
; ; Name=气刃斩1
; ; Group=气刃斩1
; ; WeaponType=3
; ; FSMId=11
; ; LMT=49265,49256
; ; Sound=sounds/气刃斩1.wav
; ; Sound:white=sounds/气刃斩1_白1.wav|0|100|F; sounds/气刃斩1_白2.wav; sounds/气刃斩1_白3.wav|40|80
; ; Sound:red=sounds/气刃斩1_红.wav
;
; ; [Active]  每武器当前组合（有命名组合时才需要写）
; ; W3=太刀-主
;
; ; [Weapon3:太刀-主]   太刀 组合"太刀-主"
; ; [Attack2]
; ; WeaponType=3
; ; FSMId=92
; ; Sound=sounds/气刃兜割.wav
; ;
; ; ---- 条件判定：匹配到动作后盯一段时间，按结果挑音效池 ----
; ; 用来做「这招打中了没有」「掉刃了没有」这类要观察一会儿才知道结果的触发。
; ; 不写 CheckTimeoutMs 就是旧行为（匹配到就立刻播），完全兼容。
; ;
; ; 变量: dmg 自己打出的伤害(不含队友) / aura dAura 太刀气刃等级及变化
; ;       charge dCharge 大剑蓄力等级及变化 / lmt fsm fsmTarget 当前动作 / ms 已过毫秒
; ; 比较符 > >= < <= == != ，用 & (且) | (或) 连接，& 优先级更高
; ; Sound:   条件一成立就播（适合已成定局的结果）
; ; SoundEnd: 只在窗口结束时评（适合还可能被推翻的结果）
; ;
; ; 例一 · 太刀登龙 命中/落空
; ; [Attack90]
; ; Name=登龙判定
; ; WeaponType=3
; ; LMT=49326
; ; CheckTimeoutMs=2500
; ; CheckEndOn=action
; ; CheckOffsetMs=150
; ; Sound:dmg>0=sounds/命中.wav
; ; Sound=sounds/落空.wav
; ;
; ; 例二 · 太刀大居 成功/失败（掉刃也能打出伤害，所以"成功"必须等窗口结束才算数）
; ; [Attack91]
; ; Name=大居判定
; ; WeaponType=3
; ; LMT=49461,49462,49463
; ; CheckTimeoutMs=3000
; ; CheckEndOn=action
; ; CheckOffsetMs=150
; ; Sound:dAura<0=sounds/失败.wav
; ; SoundEnd:dmg>0=sounds/成功.wav
; ; Sound=sounds/失败.wav
; ;
; ; 例三 · 大剑真蓄 命中/落空（两段攻击，CheckDelayMs 卡在两段中间只认第二段）
; ; [Attack92]
; ; Name=真蓄判定
; ; WeaponType=0
; ; LMT=49298,49341,49342,49427,49428,49429
; ; CheckDelayMs=1200
; ; CheckTimeoutMs=3500
; ; CheckEndOn=action
; ; CheckOffsetMs=150
; ; Sound:dmg>0=sounds/命中.wav
; ; Sound=sounds/落空.wav
; ----------------------------------------------------------------------------
