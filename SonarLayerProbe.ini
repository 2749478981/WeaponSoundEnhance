; ============================================================================
;  SonarLayerProbe.ini —— 动作层内存探针配置（v2）
;
;  用途：定位弓箭「装瓶 / 解瓶 / 平射」这类主插件读不到的动作，它们挂在
;        layer 0，而主插件读的 entity+0x6278 对这些动作恒为 0。
;
;  本工具不做判定、不发声，只把"动作对象内存里哪些字段在跳变"写进
;  plugins\SonarLayerProbe.log，变化的位置就是该动作状态真正所在的地方。
;
;  用法：
;    1. SonarLayerProbe.dll 放进 nativePC\plugins\
;    2. 进游戏，反复做「装瓶 / 解瓶 / 平射」
;    3. 退出后把 plugins\SonarLayerProbe.log 发回
; ============================================================================

; 玩家指针基址（十六进制）。小版本变动失效时才需改。
PlayerRoot=0x1450139A0

; 轮询间隔（毫秒）。50ms 内的小整数状态一般够用，想更细可调到 30。
PollMs=40

; 手动标记热键：默认 Ctrl+F7。做动作前先按一下，日志里会打一行 MARK，
; 方便把"我这次按的是装瓶"和内存跳变对齐（不受触发条件是否命中的影响）。
Hotkey=F7
